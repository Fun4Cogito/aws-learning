AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Creates an ApiGateway V2 VpcLink and a private REST API (API Gateway v1)
  with a VPC interface endpoint (execute-api) and a simple mock GET method.

Parameters:
  # Subnet CIDRs are hardcoded to match the provided subnets:
  #   subnet-06eafbd59bf77a8a3 => 10.0.2.0/28
  #   subnet-0e6494616ab1c1eac => 10.0.3.0/28

  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-07e0700256638dc14
    Description: Use an existing VPC (provided)

  SubnetAId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-06eafbd59bf77a8a3
    Description: Existing subnet A ID

  SubnetBId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0e6494616ab1c1eac
    Description: Existing subnet B ID

  RegionName:
    Type: String
    Default: ap-northeast-1
    Description: AWS Region to use (default Tokyo ? ap-northeast-1)

Resources:
  # Using an existing VPC and Subnets provided via parameters (`ExistingVpcId`, `SubnetAId`, `SubnetBId`).
  # The template no longer creates a VPC or new subnets.

  # API Gateway resources moved below (grouped with REST API integration to the ALB).
  # SecurityGroupForVpce, VPCEndpointExecuteApi, ApiGatewayVpcLink and PrivateRestApi
  # are defined later in the template together for clarity.

  # NOTE: Existing RestApi is retained (PRIVATE), but the demo /hello method is implemented
  # via an ApiGatewayV2 HTTP API that integrates to the internal ALB (see resources below).

  # === Demo ALB + backends ===
  SecurityGroupALB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for internal ALB
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.2.0/28
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.3.0/28
      Tags:
        - Key: Name
          Value: sg-internal-alb

  # SecurityGroupBackend removed ? not needed for fixed-response ALB

  DemoLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: demo-internal-alb
      Subnets:
        - !Ref SubnetAId
        - !Ref SubnetBId
      Scheme: internal
      SecurityGroups:
        - !Ref SecurityGroupALB
      Type: application

  DemoListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref DemoLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"message":"Not Found"}'

  DemoListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref DemoListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /hello
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '200'
            ContentType: application/json
            MessageBody: '{"message":"Hello from ALB backend (fixed-response)"}'

  # Backend instances removed ? ALB returns a fixed response for /hello

  # === API Gateway resources (grouped) ===
  SecurityGroupForVpce:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Interface VPC Endpoint for execute-api
      VpcId: !Ref ExistingVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.2.0/28
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.3.0/28
      Tags:
        - Key: Name
          Value: sg-vpce-execute-api

  VPCEndpointExecuteApi:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${RegionName}.execute-api
      VpcId: !Ref ExistingVpcId
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref SubnetAId
        - !Ref SubnetBId
      SecurityGroupIds:
        - !Ref SecurityGroupForVpce
      Tags:
        - Key: Name
          Value: vpce-execute-api

  ApiGatewayVpcLinkV2:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: vpc-link-v2-for-alb
      SubnetIds:
        - !Ref SubnetAId
        - !Ref SubnetBId

  PrivateRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: private-rest-api
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !Ref VPCEndpointExecuteApi
      Description: "Private REST API accessible only via VPC endpoint"
      Policy: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": "execute-api:Invoke",
              "Resource": "arn:aws:execute-api:*:*:*/*/*/*",
              "Condition": {
                "StringEquals": {
                  "aws:SourceVpce": "${VPCEndpointExecuteApi}"
                }
              }
            }
          ]
        }

  ApiResourceHello:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt PrivateRestApi.RootResourceId
      PathPart: hello
      RestApiId: !Ref PrivateRestApi

  ApiMethodHello:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PrivateRestApi
      ResourceId: !Ref ApiResourceHello
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: HTTP
        IntegrationHttpMethod: GET
        Uri: !Sub "http://${DemoLoadBalancer.DNSName}/hello"
        ConnectionType: VPC_LINK
        ConnectionId: !Ref ApiGatewayVpcLinkV2
        IntegrationTarget: !Ref DemoLoadBalancer
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: "Empty"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethodHello
    Properties:
      RestApiId: !Ref PrivateRestApi

  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref PrivateRestApi
      DeploymentId: !Ref ApiDeployment
Outputs:
  VpcId:
    Description: Existing VPC ID used for this stack
    Value: !Ref ExistingVpcId

  SubnetAId:
    Description: Subnet A ID used for this stack
    Value: !Ref SubnetAId

  SubnetBId:
    Description: Subnet B ID used for this stack
    Value: !Ref SubnetBId

  VpcLinkV2Id:
    Description: ApiGateway V2 VpcLink ID (subnet-based; usable by REST and HTTP APIs)
    Value: !Ref ApiGatewayVpcLinkV2

  VpcEndpointId:
    Description: Interface VPC Endpoint ID for execute-api
    Value: !Ref VPCEndpointExecuteApi

  PrivateRestApiId:
    Description: Rest API ID (use to form invoke URL inside the VPC)
    Value: !Ref PrivateRestApi

  PrivateRestApiInvokeUrl:
    Description: Invoke URL for the private REST API (call from inside the VPC via the VPC endpoint)
    Value: !Sub "https://${PrivateRestApi}.execute-api.${RegionName}.amazonaws.com/prod/hello"

  DemoAlbDnsName:
    Description: Internal ALB DNS name
    Value: !GetAtt DemoLoadBalancer.DNSName

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network"
        Parameters:
          - ExistingVpcId
          - SubnetAId
          - SubnetBId
          - RegionName
    ParameterLabels:
      ExistingVpcId:
        default: "Existing VPC ID"
      SubnetAId:
        default: "Subnet A ID"
      SubnetBId:
        default: "Subnet B ID"
      RegionName:
        default: "Region (default: ap-northeast-1)"

Conditions: {}

# Helper substitution for policy (CloudFormation doesn't substitute inside Policy string block automatically,
# so downstream you may need to replace ${VPCEndpointId} with the actual VPCEndpoint id in a transform, or
# alternatively use a JSON object construction instead of a literal string.)
